name: Pipeline de calidad (TDD + BDD + JaCoCo + SonarCloud)

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  SONAR_ORG: nicollemayol
  SONAR_PROJECT: NicolleMayol_testing-automatizado-grafana

jobs:
  # Ciclo interno: pruebas unitarias (TDD), rápidas y sin dependencias externas.
  tdd-unitarias:
    name: TDD - pruebas unitarias + cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Pruebas unitarias con JaCoCo (umbral 80 % líneas, 70 % ramas)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: mvn -B -ntp verify -Dgroups=unit

      - name: Resumen de cobertura
        if: always()
        run: bash ci/resumen-cobertura.sh "TDD (solo unitarias)"

      - name: Publicar reportes unitarios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tdd-unitarias-${{ github.run_number }}
          path: |
            target/surefire-reports
            target/site/jacoco

  # Ciclo externo: escenarios BDD y pruebas de extremo a extremo contra Grafana real.
  bdd-e2e:
    name: BDD - Cucumber + Playwright contra Grafana, y análisis Sonar
    needs: tdd-unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Sonar necesita el historial para atribuir líneas nuevas

      - name: Levantar Grafana y ejecutar toda la suite (unitarias + JUnit/Playwright + Cucumber)
        run: bash run-tests.sh

      - name: Resumen de cobertura
        if: always()
        run: |
          sudo chown -R "$USER" target || true
          bash ci/resumen-cobertura.sh "Suite completa (unitarias + BDD)"

      - name: Publicar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdd-e2e-${{ github.run_number }}
          path: |
            target/surefire-reports
            target/site/jacoco
            target/cucumber
            target/evidence
            target/evidence-bdd

      - uses: actions/setup-java@v4
        if: always()
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Análisis SonarCloud y quality gate
        if: success() && env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          mvn -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121:sonar
          -Dsonar.organization=$SONAR_ORG
          -Dsonar.projectKey=$SONAR_PROJECT
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=300

      - name: Métricas de Sonar en el resumen
        if: always() && env.SONAR_TOKEN != ''
        run: bash ci/metricas-sonar.sh

      - name: Apagar Grafana
        if: always()
        run: docker compose down
