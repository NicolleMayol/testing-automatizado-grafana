name: Pruebas automatizadas

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  junit-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Levantar Grafana y ejecutar la suite (JUnit 5 + Cucumber + Playwright)
        run: bash run-tests.sh

      - name: Publicar evidencia (reportes JUnit, videos, capturas, trazas)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-${{ github.run_number }}
          path: |
            target/surefire-reports
            target/evidence
            target/cucumber
            target/evidence-bdd

      - name: Apagar Grafana
        if: always()
        run: docker compose down
