# Sistema bajo prueba (Grafana OSS) + ejecutor de pruebas (JUnit 5 + Playwright Java)
services:
  grafana:
    image: grafana/grafana-oss:11.3.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "UdemTesting2026"
      # Evita bloquear al admin tras varios intentos fallidos en los casos negativos (riesgo R3)
      GF_SECURITY_DISABLE_BRUTE_FORCE_LOGIN_PROTECTION: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24

  tests:
    image: mcr.microsoft.com/playwright/java:v1.49.0-noble
    profiles: ["test"]
    depends_on:
      grafana:
        condition: service_healthy
    working_dir: /work
    volumes:
      - .:/work
      - m2-cache:/root/.m2
    environment:
      BASE_URL: http://grafana:3000
      GRAFANA_USER: admin
      GRAFANA_PASSWORD: "UdemTesting2026"
      HEADLESS: "true"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    command: ["mvn", "-B", "-ntp", "test"]

volumes:
  m2-cache:
